name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드·테스트·ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: ktlint·단위 테스트
        run: ./gradlew ktlintCheck test --continue

      - name: 실패 내용 정리
        if: failure()
        run: node .github/scripts/report-failures.mjs

      - name: 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 7

  # develop 대상 PR은 단위 테스트만 돌리고, main 대상 PR(develop → main)과 main push에서만 통합 테스트를 돈다
  integration:
    name: 통합 테스트
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 통합 테스트
        run: ./gradlew integrationTest --continue

      - name: 실패 내용 정리
        if: failure()
        run: node .github/scripts/report-failures.mjs

      - name: 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 7
