name: 배포

# 자동 배포는 이미지 workflow가 이미지 job 뒤에 이 workflow를 호출한다 (workflow_call).
# workflow_run으로 이어 붙이면 실행이 기본 브랜치(develop)에서 돈 것으로 기록돼 main 조건과 이미지 태그가 어긋난다
on:
  workflow_call:
    inputs:
      tag:
        description: 배포할 이미지 태그(커밋 SHA)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 배포할 이미지 태그(커밋 SHA). 비우면 지금 커밋
        required: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: 운영 서버 배포
    runs-on: [self-hosted, Linux]
    environment: production
    timeout-minutes: 15
    # 호출·수동 실행이 겹쳐도 배포는 한 번에 하나만 돈다
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.sha }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: 환경 파일 쓰기
        env:
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          DB_URL: ${{ vars.DB_URL }}
          APP_PORT: ${{ vars.APP_PORT }}
          SCHOOL_EMAIL_DOMAIN: ${{ vars.SCHOOL_EMAIL_DOMAIN }}
          AUTH_FRONTEND_URL: ${{ vars.AUTH_FRONTEND_URL }}
          DATAGSM_REDIRECT_URI: ${{ vars.DATAGSM_REDIRECT_URI }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATAGSM_CLIENT_ID: ${{ secrets.DATAGSM_CLIENT_ID }}
          DATAGSM_CLIENT_SECRET: ${{ secrets.DATAGSM_CLIENT_SECRET }}
        run: |
          umask 077
          {
            echo "SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE"
            echo "DB_URL=$DB_URL"
            echo "APP_PORT=$APP_PORT"
            echo "SCHOOL_EMAIL_DOMAIN=$SCHOOL_EMAIL_DOMAIN"
            echo "DB_USERNAME=$DB_USERNAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "AUTH_FRONTEND_URL=$AUTH_FRONTEND_URL"
            echo "DATAGSM_CLIENT_ID=$DATAGSM_CLIENT_ID"
            echo "DATAGSM_CLIENT_SECRET=$DATAGSM_CLIENT_SECRET"
            echo "DATAGSM_REDIRECT_URI=$DATAGSM_REDIRECT_URI"
          }> "$DEPLOY_DIR/.env"

      - name: GHCR 로그인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: 배포
        run: |
          ENV_FILE="$DEPLOY_DIR/.env" STATE_FILE="$DEPLOY_DIR/current-tag" \
            ./deploy/deploy.sh "$TAG"

      - name: GHCR 로그아웃
        if: always()
        run: docker logout ghcr.io
