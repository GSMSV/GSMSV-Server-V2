# 로컬 개발 전용 DB. 여기 계정은 로컬에서만 쓰는 값이고 운영 값과 무관하다
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=gsmsv'
      - 'POSTGRES_USER=gsmsv'
      - 'POSTGRES_PASSWORD=gsmsv'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
