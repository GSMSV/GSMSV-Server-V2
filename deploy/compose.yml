name: gsmsv

services:
  app:
    image: ghcr.io/gsmsv/gsmsv-server-v2:${IMAGE_TAG:?IMAGE_TAG가 필요하다}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      SCHOOL_EMAIL_DOMAIN: ${SCHOOL_EMAIL_DOMAIN:?}
    ports:
      - "${APP_PORT:?}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsmsv
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gsmsv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
