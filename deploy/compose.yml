name: gsmsv

# 컨테이너 로그가 디스크를 계속 차지하지 않게 크기를 제한한다 (컨테이너당 최대 10MB x 3개)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/gsmsv/gsmsv-server-v2:${IMAGE_TAG:?IMAGE_TAG가 필요하다}
    restart: unless-stopped
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      SCHOOL_EMAIL_DOMAIN: ${SCHOOL_EMAIL_DOMAIN:?}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:?}
      DATAGSM_CLIENT_ID: ${DATAGSM_CLIENT_ID:?}
      DATAGSM_CLIENT_SECRET: ${DATAGSM_CLIENT_SECRET:?}
      DATAGSM_REDIRECT_URI: ${DATAGSM_REDIRECT_URI:?}
    ports:
      - "${APP_PORT:?}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: gsmsv
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gsmsv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
