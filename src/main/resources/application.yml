spring:
  application:
    name: GSMSV-Server-V2
  profiles:
    # 프로필을 주지 않고 실행하면 로컬 개발로 본다. dev·prod는 배포 환경에서 SPRING_PROFILES_ACTIVE로 지정한다
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-dates-with-context-time-zone: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. Hibernate는 엔티티와 스키마가 맞는지만 검사한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

gsmsv:
  security:
    jwt:
      # Base64로 인코딩한 32바이트 이상의 무작위 값. 환경 변수로만 받고 기본값을 두지 않는다 (예: openssl rand -base64 32)
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
  quota:
    # Contracts-V2 policies/quota.md 3·4장의 값이다. 배포 없이 바꿀 수 있게 프로필 설정이나 환경 변수로 덮어쓴다
    personal:
      vcpu: 4
      ram-gib: 8
      ssd-gib: 30
    team:
      vcpu: 8
      ram-gib: 16
      ssd-gib: 60
  database:
    connection:
      # 사용자에게 보여 주는 접속 주소다. 노드를 드러내지 않는 이름을 운영 환경 변수로 넣는다
      host: ${DATABASE_CONNECTION_HOST:localhost}
      port: 3306
      tls: true
    # 공유형 용량 한도 (Contracts-V2 services/database.md 7장). 소유자별 합계, GiB
    storage-limit:
      personal-gib: 1
      team-gib: 2

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/dev
