spring:
  application:
    name: GSMSV-Server-V2
  profiles:
    # 프로필을 주지 않고 실행하면 로컬 개발로 본다. dev·prod는 배포 환경에서 SPRING_PROFILES_ACTIVE로 지정한다
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-dates-with-context-time-zone: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. Hibernate는 엔티티와 스키마가 맞는지만 검사한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
