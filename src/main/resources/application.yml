spring:
  application:
    name: GSMSV-Server-V2
  profiles:
    # 프로필을 주지 않고 실행하면 로컬 개발로 본다. dev·prod는 배포 환경에서 SPRING_PROFILES_ACTIVE로 지정한다
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-dates-with-context-time-zone: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. Hibernate는 엔티티와 스키마가 맞는지만 검사한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # 마이그레이션 버전은 타임스탬프라 병합 순서와 어긋날 수 있다. 먼저 만들고 나중에 병합된 것도 적용하게 둔다.
    # 전제는 마이그레이션끼리 서로 의존하지 않는 것이다 (AGENTS.md 2.3)
    out-of-order: true

gsmsv:
  team:
    email-domain: ${SCHOOL_EMAIL_DOMAIN:}
  security:
    jwt:
      # Base64로 인코딩한 32바이트 이상의 무작위 값. 환경 변수로만 받고 기본값을 두지 않는다 (예: openssl rand -base64 32)
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
  datagsm:
    # DataGSM OAuth 클라이언트 등록 정보 (https://docs.datagsm.kr/oauth). 환경 변수로만 받고 기본값을 두지 않는다. 비어 있으면 기동에 실패한다
    client-id: ${DATAGSM_CLIENT_ID}
    client-secret: ${DATAGSM_CLIENT_SECRET}
    redirect-uri: ${DATAGSM_REDIRECT_URI}
  rate-limit:
    # 한도 값은 Contracts-V2 openapi/auth.yaml(IP당 분당 10회)과 services/one-touch-deploy.md(사용자당 분당 60회)를 따른다
    # 카운터는 인스턴스 메모리에만 있다. IP 기준은 프록시 뒤에서 전달 헤더를 해석하도록 서버가 설정돼 있어야 실제 클라이언트 IP가 된다
    enabled: true
    rules:
      - name: auth-login
        paths: /api/v2/auth/datagsm/authorize,/api/v2/auth/datagsm/callback,/api/v2/auth/token-exchange
        key: IP
        limit: 10
        window: 1m
      - name: subdomain-availability
        paths: /api/v2/apps/subdomains/availability
        key: USER
        limit: 60
        window: 1m
  quota:
    # Contracts-V2 policies/quota.md 3·4장의 값이다. 배포 없이 바꿀 수 있게 프로필 설정이나 환경 변수로 덮어쓴다
    personal:
      vcpu: 4
      ram-gib: 8
      ssd-gib: 30
    team:
      vcpu: 8
      ram-gib: 16
      ssd-gib: 60
  database:
    connection:
      # 사용자에게 보여 주는 접속 주소다. 노드를 드러내지 않는 이름을 운영 환경 변수로 넣는다
      host: ${DATABASE_CONNECTION_HOST:localhost}
      port: 3306
      tls: true
    # 공유형 용량 한도 (Contracts-V2 services/database.md 7장). 소유자별 합계, GiB
    storage-limit:
      personal-gib: 1
      team-gib: 2
    # 소유자별 DB 개수 한도 (Contracts-V2 services/database.md 7장). 전용형 포함
    count-limit:
      personal: 2
      team: 4
  infra:
    # Go 내부 API 연결 설정. 값은 환경 변수로만 받고 기본값에 실제 값을 두지 않는다 (dev·local은 모의 구현이라 비어 있어도 된다)
    base-url: ${INFRA_BASE_URL:}
    shared-secret: ${INFRA_SHARED_SECRET:}
    # 공유 시크릿을 실어 보내는 헤더 이름. Go 담당과 정하기 전까지의 임시 값이다 (#80 미정 항목)
    secret-header: X-Internal-Secret
    connect-timeout: 2s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 상태 페이지 감시 도구에는 status만 준다. DB 종류·디스크 같은 내부 정보는 응답에 넣지 않는다 (28번)
      show-details: never
      show-components: never

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/dev
